<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Nice To Meet You</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f4f4f4;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
        }

        #vraag {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 18px;
        }

        .goed {
            color: green;
            font-weight: bold;
        }

        .fout {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Nice To Meet You</h2>

        <div id="score">
            Score: 0/0
        </div>

        <div id="vraag"></div>

        <input id="antwoord">

        <button onclick="controleer()">
            Controleer
        </button>

        <button onclick="foutenRonde()">
            Alleen fouten oefenen
        </button>

        <div id="feedback"></div>

    </div>

    <script>

        const woorden = [
            ['colour', 'kleur'],
            ['awkward', 'ongemakkelijk'],
            ['clumsy', 'onhandig'],
            ['messy', 'slordig, rommelig'],
            ['impatient', 'ongeduldig'],
            ['shy', 'verlegen'],
            ['serious', 'serieus'],
            ['talkative', 'spraakzaam'],
            ['patient', 'geduldig'],
            ['surname', 'achternaam'],
            ['country', 'land'],
            ['first name', 'voornaam'],
            ['kind of music', 'soort muziek'],
            ['easy', 'makkelijk'],
            ['usually', 'meestal'],
            ['keeping secrets', 'geheimen bewaren'],
            ['singer', 'zanger'],
            ['musician', 'muzikant'],
            ['enthusiastic', 'enthousiast']
        ];

        let lijst = [...woorden];
        let fouten = [];
        let huidige = null;
        let goed = 0;
        let totaal = 0;

        function volgende() {

            if (lijst.length === 0) {
                document.getElementById('vraag').innerHTML = '🎉 Klaar!';
                return;
            }

            const i = Math.floor(Math.random() * lijst.length);

            const w = lijst.splice(i, 1)[0];

            const flip = Math.random() < 0.5;

            huidige = {
                vraag: flip ? w[0] : w[1],
                antwoord: flip ? w[1] : w[0],
                orig: w
            };

            document.getElementById('vraag').textContent = huidige.vraag;

            document.getElementById('antwoord').value = '';

            document.getElementById('feedback').innerHTML = '';
        }

        function controleer() {

            if (!huidige) return;

            const g =
                document.getElementById('antwoord')
                    .value
                    .trim()
                    .toLowerCase();

            totaal++;

            if (g === huidige.antwoord.toLowerCase()) {

                goed++;

                document.getElementById('feedback').innerHTML =
                    '<div class="goed">✅ Goed!</div>';

            } else {

                fouten.push(huidige.orig);

                document.getElementById('feedback').innerHTML =
                    '<div class="fout">❌ Fout<br>Juiste antwoord: '
                    + huidige.antwoord +
                    '</div>';
            }

            document.getElementById('score').textContent =
                'Score: ' + goed + '/' + totaal;

            setTimeout(volgende, 4000);
        }

        function foutenRonde() {

            if (fouten.length === 0) {
                alert('Nog geen fouten');
                return;
            }

            lijst = [...fouten];

            fouten = [];

            goed = 0;
            totaal = 0;

            document.getElementById('score').textContent = 'Score: 0/0';

            volgende();
        }

        document.getElementById('antwoord')
            .addEventListener('keydown', e => {

                if (e.key === 'Enter') {
                    controleer();
                }

            });

        volgende();

    </script>

</body>

</html>
