<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nice to meet you</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6fb;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:18px;
}

#question{
    font-size:30px;
    font-weight:bold;
    text-align:center;
    margin:25px 0;
}

input{
    width:100%;
    padding:15px;
    font-size:20px;
    box-sizing:border-box;
}

.good{
    color:green;
    font-weight:bold;
}

.bad{
    color:red;
    font-weight:bold;
}

h1{
    text-align:center;
}
</style>
</head>
<body>

<div class="container">

<div class="card" id="menu">

<h1>👋 Nice To Meet You</h1>

<button onclick="startSet('words')">
📚 Words to know
</button>

<button onclick="startSet('phrases')">
💬 Phrases
</button>

<button onclick="startSet('grammar')">
⭐ Grammar
</button>

</div>

<div class="card" id="quiz" style="display:none;">

<div id="score">
Score: 0 / 0
</div>

<div id="question"></div>

<input id="answer" autocomplete="off">

<button onclick="checkAnswer()">
Controleer
</button>

<button onclick="practiceMistakes()">
🔄 Alleen fouten oefenen
</button>

<div id="feedback"></div>

</div>

</div>

<script>

const sets = {

words: [

["colour","kleur"],
["awkward","ongemakkelijk"],
["clumsy","onhandig"],
["messy","slordig, rommelig"],
["impatient","ongeduldig"],
["shy","verlegen"],
["serious","serieus"],
["talkative","spraakzaam"],
["patient","geduldig"],
["surname","achternaam"],
["country","land"],
["first name","voornaam"],
["kind of music","soort muziek"],
["easy","makkelijk"],
["usually","meestal"],
["keeping secrets","geheimen bewaren"],
["singer","zanger"],
["musician","muzikant"],
["enthusiastic","enthousiast"]

],

phrases: [

["Do you play football?","Speel jij voetbal?"],

["Do you have any siblings?","Heb je broers of zussen?"],

["What are you good at?","Waar ben je goed in?"],

["What do you like doing in your free time?","Wat doe jij graag in je vrije tijd?"],

["What do you want to be when you grow up?","Wat wil je later worden?"],

["What is your favourite food?","Wat is jouw lievelingseten?"],

["When is your birthday?","Wanneer ben je jarig?"],

["Where do you come from?","Waar kom je vandaan?"]

],

grammar: [

["after","na"],
["at","om"],
["before","voor"],
["during","tijdens"],
["on","op"],
["until","tot"]

]

};

let currentSet = [];
let currentQuestion = null;
let mistakes = [];
let good = 0;
let total = 0;

function startSet(setName){

    currentSet = [...sets[setName]];
    mistakes = [];
    good = 0;
    total = 0;

    document.getElementById("menu").style.display="none";
    document.getElementById("quiz").style.display="block";

    nextQuestion();
}

function nextQuestion(){

   if(currentSet.length === 0){

    const totaalWoorden =
        good + mistakes.length;

    const foutenAantal =
        mistakes.length;

    const percentage =
        Math.round(
            (good / totaalWoorden) * 100
        );

    let sterren = "⭐";

    if(percentage >= 80){
        sterren = "⭐⭐";
    }

    if(percentage === 100){
        sterren = "⭐⭐⭐";
    }

    document.getElementById("question").innerHTML = `
        🎉 Klaar!
        <br><br>
        ${totaalWoorden} woorden geleerd
        <br><br>
        ${foutenAantal} fouten gemaakt tijdens het oefenen
        <br><br>
        Eindscore: ${percentage}%
        <br><br>
        ${sterren}
    `;

    document.getElementById("answer").style.display = "none";

    document.getElementById("feedback").innerHTML = "";

    return;
}


    const index = Math.floor(
        Math.random() * currentSet.length
    );

    const pair =
        currentSet.splice(index,1)[0];

    const reverse =
        Math.random() < 0.5;

    currentQuestion = {

        ask: reverse ? pair[1] : pair[0],
        answer: reverse ? pair[0] : pair[1],
        original: pair

    };

    document.getElementById("question")
    .textContent = currentQuestion.ask;

    document.getElementById("answer").value="";
    document.getElementById("feedback").innerHTML="";
}

function checkAnswer(){

    const answer =
        document.getElementById("answer")
        .value
        .trim()
        .toLowerCase();

    total++;

    if(
        answer ===
        currentQuestion.answer.toLowerCase()
    ){

        good++;

        document.getElementById("feedback")
        .innerHTML =
        "<div class='good'>✅ Goed!</div>";

    }else{

        mistakes.push(
            currentQuestion.original
        );

        document.getElementById("feedback")
        .innerHTML =
        "<div class='bad'>❌ Fout<br>Juiste antwoord: "
        + currentQuestion.answer +
        "</div>";
    }

    document.getElementById("score")
    .innerHTML =
    "Score: " + good + " / " + total;

    setTimeout(nextQuestion,5000);
}

function practiceMistakes(){

    if(mistakes.length===0){

        alert("Geen fouten gemaakt 🎉");
        return;
    }

    currentSet = [...mistakes];
    mistakes = [];

    nextQuestion();
}

document
.getElementById("answer")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        checkAnswer();
    }

});

</script>

</body>
</html>
